name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run JVM unit tests
        # ubuntu-24.04 exports ANDROID_SDK_ROOT to /usr/local/lib/android/sdk.
        # Unset it so Gradle sees only the project ANDROID_HOME from mise.
        run: |
          unset ANDROID_SDK_ROOT
          mise run unit-test
